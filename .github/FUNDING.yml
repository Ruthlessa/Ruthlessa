# GitHub Sponsorship 配置
# 这些是受支持的赞助平台，配置后 GitHub 仓库页面右侧将显示 "Sponsor" 按钮

# GitHub Sponsors (GitHub 官方赞助)
github: [Ruthlessa]

# Buy Me a Coffee - 将下方用户名替换为您的实际 Buy Me a Coffee 账号
buy_me_a_coffee: ruthlessa

# 自定义链接：PayPal（海外用户扫码或访问链接赞助）
# 如您的 PayPal Me 链接不是 ruthlessa，请修改下方 URL 为实际地址
custom: ['https://paypal.me/ruthlessa']

# 如需启用更多赞助平台，取消注释并填写对应信息：
# patreon: ruthlessa                  # Patreon 用户名
# open_collective: ruthlessa          # Open Collective 项目名
# ko_fi: ruthlessa                    # Ko-fi 用户名
# liberapay: ruthlessa                # Liberapay 用户名
